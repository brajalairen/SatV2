[build-system]
requires = ["setuptools>=77"]  # >=77: PEP 639 SPDX `license` string + `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "satquery"
version = "0.1.0"
description = "SatQuery AI (SIH26167): agentic vision-language assistant for remote-sensing image analysis"
readme = "README.md"
# HF ZeroGPU supports Python 3.10.13 and 3.12.12 only (D-020).
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.3",
  "pydantic>=2.6",
  "rasterio>=1.3.10",
  "scipy>=1.11",
]

[project.optional-dependencies]
ui = ["gradio>=5.20,<6"]
# Map-first React frontend (D-023): FastAPI serves the built web/ bundle and wraps analyze().
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
models = [
  "torch>=2.8,<2.9",            # = Space pin (requirements.txt); ZeroGPU needs 2.8+ (D-020)
  "transformers==4.49.0",       # Falcon remote code lacks GenerationMixin: must stay < 4.50 (D-021)
  "timm==1.0.15",
  "einops>=0.8",
  "huggingface_hub>=0.26,<1.0",
]
dev = ["pytest>=8", "httpx2>=0.28"]  # httpx2: starlette TestClient (tests/test_server.py)
data = ["pandas>=2.2", "pyarrow>=16"]  # scripts/build_round1_subset.py, scripts/inspect_bigearthnet.py

[project.scripts]
satquery = "satquery.cli:main"

[tool.setuptools.packages.find]
include = ["satquery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU and downloaded model weights"]
addopts = "-m 'not gpu'"
